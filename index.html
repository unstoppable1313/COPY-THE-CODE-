<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Copy Text</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;font-family:Arial,sans-serif;background:#f4f4f5}
.card{width:min(100%,520px);background:#fff;border-radius:18px;padding:24px;box-shadow:0 8px 30px #0002}
h1{margin:0 0 18px;text-align:center;font-size:22px}
.text{padding:16px;border-radius:12px;background:#f0f0f0;font:15px/1.6 monospace;word-break:break-all;white-space:pre-wrap;user-select:text}
button{width:100%;margin-top:16px;padding:15px;border:0;border-radius:12px;background:#111;color:#fff;font-size:16px;font-weight:bold}
.status{text-align:center;min-height:20px;margin-top:10px;font-size:13px}
</style>
</head>
<body>
<main class="card">
<h1>Copy this text</h1>
<div class="text" id="text"></div>
<button id="copy">📋 Copy Text</button>
<div class="status" id="status"></div>
</main>
<script>
const defaultText = '057278b0dfe8be5bfa2d1441c69e4d870acc8df298f58b41c30c5be0c0f8a42863';
const text = new URLSearchParams(location.search).get("text") || defaultText;
document.getElementById("text").textContent = text;
document.getElementById("copy").onclick = async () => {
  try {
    await navigator.clipboard.writeText(text);
  } catch (e) {
    const ta=document.createElement("textarea");
    ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove();
  }
  document.getElementById("copy").textContent="✓ Copied!";
  document.getElementById("status").textContent="Text copied to clipboard.";
  setTimeout(()=>{document.getElementById("copy").textContent="📋 Copy Text";document.getElementById("status").textContent=""},1800);
};
</script>
</body>
</html>
